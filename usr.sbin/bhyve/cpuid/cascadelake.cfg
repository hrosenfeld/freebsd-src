#
# Intel Cascade Lake
#
# All of the Skylake features, plus:
# AVX512VNNI
#
# Masked by vmm: INTEL_IBPB, PKU, SSBD
#

include skylake.cfg

cpuid.model=85
cpuid.stepping=7

cpuid.features+=avx512vnni

cpuid.brand=Intel(R) Xeon(R) W-3275 CPU @ 2.50GHz
# Cache / TLB
#
# 76: iTLB 2M/4M:         full, 8 entries
# 03: dTLB 4k:            4-way, 64 entries
# 63: dTLB 2M/4M + 1GB:   4-way, 32 entries + 4-way, 4 entries
# 01: Cache / TLB info valid
# f0: Prefetching:        64b
# b5: iTLB 4k:            8-way, 64 entries
# ff: use 0x00000004 for cache information
# c3: L2 TLB 4k/2M + 1GB: 6-way, 1536 entries + 4-way, 16 entries
cpuid.0x00000002=eax=0x76036301,ebx=0x00f0b5ff,ecx=0,edx=0x00c30000
