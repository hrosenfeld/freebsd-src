#
# x86-64 architecture level v4
#
# Correponds roughly to Intel Skylake
#
# Enable the following instruction set extensions:
# AVX512BW, AVX512DQ, AVX512F, AVX512VL
#
# XCR0 available features: HI16_ZMM, OPMASK, ZMM_HI256
#
include x86-64-v3.cfg

cpuid.features+=hi16_zmm,opmask,zmm_hi256
cpuid.features+=avx512bw,avx512dq,avx512f,avx512vl

cpuid.brand=bhyve x86-64 Architecture Level v4

# Intel Cache / TLB
#
# 76: iTLB 2M/4M:         full, 8 entries
# 03: dTLB 4k:            4-way, 64 entries
# 63: dTLB 2M/4M + 1GB:   4-way, 32 entries + 4-way, 4 entries
# 01: Cache / TLB info valid
# f0: Prefetching:        64b
# b5: iTLB 4k:            8-way, 64 entries
# ff: use 0x00000004 for cache information
# c3: L2 TLB 4k/2M + 1GB: 6-way, 1536 entries + 4-way, 16 entries
cpuid.0x00000002=eax=0x76036301,ebx=0x00f0b5ff,ecx=0,edx=0x00c30000

# Intel Deterministic Cache Parameters
#
# L1 data cache, self-initializng
# L1d: no WBINVD/INVD, 8-way, 1 partition, 64b lines, 64 sets (32k)
cpuid.0x00000004,0x00+=eax|=0x00000121,ebx=0x01c0003f,ecx=0x0000003f,edx=0x00000000
#
# L1 inst cache, self-initializing
# L1i: no WBINVD/INVD, 8-way, 1 partition, 64b lines, 64 sets (32k)
cpuid.0x00000004,0x01+=eax|=0x00000122,ebx=0x01c0003f,ecx=0x0000003f,edx=0x00000000
#
# L2 unified cache, self-initializing
# L2: no WBINVD/INVD, 16-way, 1 partition, 64b lines, 512 sets (512k)
cpuid.0x00000004,0x02+=eax|=0x0000143,ebx=0x03c0003f,ecx=0x000001ff,edx=0x00000000
#
# L3 unified cache, self-initializing, inclusive
# L3: 11-way, 1 partition, 64b lines, 57344 sets (38M)
cpuid.0x00000004,0x03+=eax|=0x0000163,ebx=0x0280003f,ecx=0x0000dfff,edx=0x00000006
