#
# Clear all CPUID bits that can be safely cleared.
#

# 0x00000000: Leave CPU Vendor intact, but clear max CPUID function.
cpuid.0x00000000=eax=0

# 0x00000001: Standard Features. Clear all except HV, topology and CLFLSH line
# size in EBX.
cpuid.0x00000001=eax=0,ebx&=0xffffff00,ecx=0,edx=0
cpuid.features+=hv

# 0x00000002: Cache and TLB information. Clear all.
cpuid.0x00000002=eax=0,ebx=0,ecx=0,edx=0

# 0x00000003: Processor Serial Number (Pentium III)
cpuid.0x00000003=eax=0,ebx=0,ecx=0,edx=0

# 0x00000004: Deterministic Cache Parameters
# Upper bits of EAX define cache topology, leave as set by vmm
cpuid.0x00000004,0x00=eax&=0xfffffc00,ebx=0,ecx=0,edx=0
cpuid.0x00000004,0x01=eax&=0xfffffc00,ebx=0,ecx=0,edx=0
cpuid.0x00000004,0x02=eax&=0xfffffc00,ebx=0,ecx=0,edx=0
cpuid.0x00000004,0x03=eax&=0xfffffc00,ebx=0,ecx=0,edx=0
cpuid.0x00000004,0x04=eax=0,ebx=0,ecx=0,edx=0

# 0x00000005: Monitor/MWAIT
cpuid.0x00000005=eax=0,ebx=0,ecx=0,edx=0

# 0x00000006: Thermal and Power Management; clear all but ARAT
cpuid.0x00000006=eax=0,ebx=0,ecx=0,edx=0
cpuid.features+=arat

# 0x00000007: Structured Extended Features
cpuid.0x00000007=eax=0,ebx=0,ecx=0,edx=0

# 0x00000008: Reserved
cpuid.0x00000008=eax=0,ebx=0,ecx=0,edx=0

# 0x00000009: Direct Cache Access
cpuid.0x00000009=eax=0,ebx=0,ecx=0,edx=0

# 0x0000000a: Architectural Performance Monitoring
cpuid.0x0000000a=eax=0,ebx=0,ecx=0,edx=0

# 0x0000000b: Intel Processor Topology, leave as defined by vmm

# 0x0000000c: Reserved
cpuid.0x0000000c=eax=0,ebx=0,ecx=0,edx=0

# 0x0000000d: Processor Extended State enumeration
cpuid.0x0000000d,0x00=eax=0,edx=0
cpuid.0x0000000d,0x01=eax=0,ecx=0,edx=0

# 0x0000000e: Reserved
cpuid.0x0000000e=eax=0,ebx=0,ecx=0,edx=0

# 0x0000000f: Intel Resrouce Director: Monitoring
cpuid.0x0000000f=eax=0,ebx=0,ecx=0,edx=0

# 0x00000010: Intel Resrouce Director: Allocation
cpuid.0x00000010=eax=0,ebx=0,ecx=0,edx=0

# 0x00000011: Reserved
cpuid.0x00000011=eax=0,ebx=0,ecx=0,edx=0

# 0x00000012: Intel SGX Attributes Enumeration
cpuid.0x00000012=eax=0,ebx=0,ecx=0,edx=0

# 0x00000013: Reserved
cpuid.0x00000013=eax=0,ebx=0,ecx=0,edx=0

# 0x00000014: Intel Processor Trace
cpuid.0x00000014=eax=0,ebx=0,ecx=0,edx=0

# 0x00000015: Timestamp Counter and Nominal Core Crystal Clock
cpuid.0x00000015=eax=0,ebx=0,ecx=0,edx=0

# 0x00000016: Processor Frequency Information
cpuid.0x00000016=eax=0,ebx=0,ecx=0,edx=0

# 0x00000017: System-On-Chip Vendor Attribute Enumeration
cpuid.0x00000017,0x00=eax=0,ebx=0,ecx=0,edx=0

# 0x00000018: Deterministic Address Translation Parameters
cpuid.0x00000018,0x00=eax=0,ebx=0,ecx=0,edx=0
cpuid.0x00000018,0x01=eax=0,ebx=0,ecx=0,edx=0
cpuid.0x00000018,0x02=eax=0,ebx=0,ecx=0,edx=0
cpuid.0x00000018,0x03=eax=0,ebx=0,ecx=0,edx=0
cpuid.0x00000018,0x04=eax=0,ebx=0,ecx=0,edx=0
cpuid.0x00000018,0x05=eax=0,ebx=0,ecx=0,edx=0
cpuid.0x00000018,0x06=eax=0,ebx=0,ecx=0,edx=0
cpuid.0x00000018,0x07=eax=0,ebx=0,ecx=0,edx=0
cpuid.0x00000018,0x08=eax=0,ebx=0,ecx=0,edx=0

# 0x00000019: Key Locker Information
cpuid.0x00000019=eax=0,ebx=0,ecx=0,edx=0

# 0x0000001a: Native Model ID Enumeration
cpuid.0x0000001a=eax=0,ebx=0,ecx=0,edx=0

# 0x0000001b: PCONFIG Information
cpuid.0x0000001b=eax=0,ebx=0,ecx=0,edx=0

# 0x0000001c: Last Branch Records Information
cpuid.0x0000001c=eax=0,ebx=0,ecx=0,edx=0

# 0x0000001d: Tile Information
cpuid.0x0000001d=eax=0,ebx=0,ecx=0,edx=0

# 0x0000001e: TMUL Information
cpuid.0x0000001e=eax=0,ebx=0,ecx=0,edx=0

# 0x0000001f: V2 Extended Topology Enumeration
cpuid.0x0000001f=eax=0,ebx=0,ecx=0,edx=0

# 0x00000020: Processor History Reset
cpuid.0x00000020=eax=0,ebx=0,ecx=0,edx=0

# 0x80000000: Extended Function CPUID Information
# Leave CPU Vendor intact, but clear max ext. CPUID function.
cpuid.0x80000000=eax=0

# 0x80000001: Extended Processor Signature and Features
cpuid.0x80000001=eax=0,ebx=0,ecx=0,edx=0

# 0x80000002-4: Processor Brand String
cpuid.0x80000002=eax=0,ebx=0,ecx=0,edx=0
cpuid.0x80000003=eax=0,ebx=0,ecx=0,edx=0
cpuid.0x80000004=eax=0,ebx=0,ecx=0,edx=0

# 0x80000005: AMD L1 Cache/TLB information
cpuid.0x80000005=eax=0,ebx=0,ecx=0,edx=0

# 0x80000006: AMD L2/L3 Cache/TLB information
cpuid.0x80000006=eax=0,ebx=0,ecx=0,edx=0

# 0x80000007: AMD Extended Features: TSC_INVARIANT as set by vmm.
cpuid.0x80000007=eax=0,ebx=0,ecx=0,edx&=0x100

# 0x80000008: AMD Extended Features
cpuid.0x80000008=eax=0,ebx=0,ecx=0,edx=0

# 0x80000009: Reserved
cpuid.0x80000009=eax=0,ebx=0,ecx=0,edx=0

# 0x8000000a: AMD Secure Virtual Machine (XXX: vmm should mask this)
cpuid.0x8000000a=eax=0,ebx=0,ecx=0,edx=0

# 0x8000000b: Reserved
cpuid.0x8000000b=eax=0,ebx=0,ecx=0,edx=0

# 0x8000000c: Reserved
cpuid.0x8000000c=eax=0,ebx=0,ecx=0,edx=0

# 0x8000000d: AMD Extended State Enumeration (obsolete)
cpuid.0x8000000d=eax=0,ebx=0,ecx=0,edx=0

# 0x8000000e: Reserved
cpuid.0x8000000e=eax=0,ebx=0,ecx=0,edx=0

# 0x8000000f: Reserved
cpuid.0x8000000f=eax=0,ebx=0,ecx=0,edx=0

# 0x80000010: Reserved
cpuid.0x80000010=eax=0,ebx=0,ecx=0,edx=0

# 0x80000011: Reserved
cpuid.0x80000012=eax=0,ebx=0,ecx=0,edx=0

# 0x80000012: Reserved
cpuid.0x80000012=eax=0,ebx=0,ecx=0,edx=0

# 0x80000013: Reserved
cpuid.0x80000013=eax=0,ebx=0,ecx=0,edx=0

# 0x80000014: Reserved
cpuid.0x80000014=eax=0,ebx=0,ecx=0,edx=0

# 0x80000015: Reserved
cpuid.0x80000015=eax=0,ebx=0,ecx=0,edx=0

# 0x80000016: Reserved
cpuid.0x80000016=eax=0,ebx=0,ecx=0,edx=0

# 0x80000017: Reserved
cpuid.0x80000017=eax=0,ebx=0,ecx=0,edx=0

# 0x80000018: Reserved
cpuid.0x80000018=eax=0,ebx=0,ecx=0,edx=0

# 0x80000019: Reserved
cpuid.0x80000019=eax=0,ebx=0,ecx=0,edx=0

# 0x8000001a: Reserved
cpuid.0x8000001a=eax=0,ebx=0,ecx=0,edx=0

# 0x8000001b: Reserved
cpuid.0x8000001b=eax=0,ebx=0,ecx=0,edx=0

# 0x8000001c: Reserved
cpuid.0x8000001c=eax=0,ebx=0,ecx=0,edx=0

# 0x8000001d: AMD Cache Topology, leave as defined by vmm

# 0x8000001e: AMD Additonal Identifiers, leave as defined by vmm

# 0x8000001f: Reserved
cpuid.0x8000001f=eax=0,ebx=0,ecx=0,edx=0

# 0x80000020: AMD PQOS Extended Features
cpuid.0x8000001f=eax=0,ebx=0,ecx=0,edx=0
