#
# Intel Core Duo
#
# All of the Pentium III features, plus:
# CLFSH, HTT, NX, PBE, SS, SSE2, SSE3, xTPR
# Masked by vmm: ACPI, DS, EST, MON, TM, TM2, PDCM, VMX
#
include pentium3.cfg

cpuid.level=0x0000000a
cpuid.xlevel=0x80000008

cpuid.model=14
cpuid.stepping=8

cpuid.features+=clfsh,nx,pbe,ss,sse2,sse3,xtpr

cpuid.physical=32
cpuid.linear=32

cpuid.brand=Genuine Intel(R) CPU           T2600  @ 2.16GHz

# Cache / TLB
#
# 02: iTLB 4M:       full, 2 entries
# b3: dTLB 4k:       4-way, 128 entries
# b0: iTLB 4k:       4-way, 128 entries
# f0: Prefetching:   64b
# 01: Cache / TLB info valid
# 2c: L1 data cache: 32k, 8-way, 64b lines
# 04: dTLB 4M:       4-way, 8 entries
# 30: L1 inst cache: 32k, 8-way, 64b lines
# 7d: L2 cache:      2M, 8-way, 64b lines
cpuid.0x00000002=eax=0x02b3b001,ebx=0x000000f0,ecx=0,edx=0x2c04307d

# Deterministic Cache Parameters
#
# L1 data cache, self-initializing
# L1d: WBINVD/INVD, 8-way, 1 partition, 64b lines, 64 sets (32k)
cpuid.0x00000004,0x00+=eax|=0x00000121,ebx=0x01c0003f,ecx=0x0000003f,edx=0x00000001
#
# L1 inst cache, self-initializing
# L1i: WBINVD/INVD, 8-way, 1 partition, 64b lines, 64 sets (32k)
cpuid.0x00000004,0x01+=eax|=0x00000122,ebx=0x01c0003f,ecx=0x0000003f,edx=0x00000001
#
# L2 unified cache, self-initializing
# L2: WBINVD/INVD, 8-way, 1 partition, 64b lines, 4096 sets (2M)
cpuid.0x00000004,0x02+=eax|=0x00000143,ebx=0x01c0003f,ecx=0x00000fff,edx=0x00000001
