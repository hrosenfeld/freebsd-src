#
# x86-64 architecture level v3
#
# Corresponds roughly to Intel Haswell / AMD Excavator
#
# Enable the following instruction set extensions:
# ABM, AVX, AVX2, BMI1, BMI2, F16C, FMA, MOVBE, OSXSAVE, XSAVEOPT
#
# For OSXSAVE and XSAVEOPT, XSAVE must be enabled as well.
#
# XCR0 available features: X87, XMM, YMM_HI128
#
include x86-64-v2.cfg

cpuid.level=0xd

cpuid.features+=x87,xmm,ymm_hi128
cpuid.features+=abm,avx,avx2,bmi1,bmi2,f16c,fma,movbe,osxsave,xsave,xsaveopt

cpuid.brand=bhyve x86-64 Architecture Level v3

# Intel Cache / TLB
#
# 76: iTLB 2M/4M:       full, 8 entries
# 03: dTLB 4k:          4-way, 64 entries
# 63: dTLB 2M/4M + 1GB: 4-way, 32 entries + 4-way, 4 entries
# 01: Cache / TLB info valid
# f0: Prefetching:      64b
# b5: iTLB 4k:          8-way, 64 entries
# ff: use 0x00000004 for cache information
# c1: L2 TLB 4k/2M:     8-way, 1024 entries
cpuid.0x00000002=eax=0x76036301,ebx=0x00f0b5ff,ecx=0,edx=0x00c10000

# Intel Deterministic Cache Parameters
#
# L1 data cache, self-initializing,
# L1d: no WBINVD/INVD, 8-way, 1 partition, 64b lines, 64 sets (32k)
cpuid.0x00000004,0x00+=eax|=0x00000121,ebx=0x01c0003f,ecx=0x0000003f,edx=0
#
# L2 inst cache, self-initializing
# L1i: no WBINVD/INVD, 8-way, 1 partition, 64b lines, 64 sets (32k)
cpuid.0x00000004,0x01+=eax|=0x00000122,ebx=0x01c0003f,ecx=0x0000003f,edx=0
#
# L2 unified cache, self-initializing
# L2: no WBINVD/INVD, 8-way, 1 partition, 64b lines, 512 sets (256k)
cpuid.0x00000004,0x02+=eax|=0x00000143,ebx=0x01c0003f,ecx=0x000001ff,edx=0
#
# L3 unified cache, self-initializing, inclusive, complex indexing
# L3: 16-way, 1 partition, 64b lines, 12288 sets (12M)
cpuid.0x00000004,0x03+=eax|=0x00000163,ebx=0x03c0003f,ecx=0x00002fff,edx=0x00000006

# AMD L1 Cache / TLB
#
# L1 TLB 2M/4M:  0xff40ff18 (dTLB: full, 64 entries, iTLB: full, 24 entries)
# L1 TLB 4k:     0xff20ff30 (dTLB: full, 32 entries, iTLB: full, 48 entries)
# L1 data cache: 0x10040140 (16k, 4-way, 1 line/tag, 64b lines)
# L1 inst cache: 0x40020140 (64k, 2-way, 1 line/tag, 64b lines)
cpuid.0x80000005=eax=0xff20ff18,ebx=0xff20ff30,ecx=0x10040140,edx=0x40020140

# AMD L2/L3 Cache / TLB
#
# L2 TLB 2M/4M:  0x64000000 (dTLB: 8-way, 512 entries, iTLB: unsupported)
# L2 TLB 4k:     0x64004200 (dTLB: 8-way, 512 entries, iTLB: 4-way, 512 entries)
# L2 cache:      0x08008140 (512k, 16-way, 1 line/tag, 64b lines)
# L3 cache:      0x0060e140 (12MB-12.5MB, 128-way, 1 line/tag, 64b lines)
cpuid.0x80000006=eax=64006400,ebx=64004200,ecx=08008140,edx=0060e140
