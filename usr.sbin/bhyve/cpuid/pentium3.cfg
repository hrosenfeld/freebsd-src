#
# Intel Pentium III
#
# All of the Pentium II features, plus:
# SSE
#
include pentium2.cfg

cpuid.level=0x00000003

cpuid.model=7
cpuid.stepping=3

cpuid.features+=sse

# Cache / TLB
#
# iTLB 4k:       4-way, 32 entries
# iTLB 4M:       full, 2 entries
# dTLB 4k:       4-way, 64 entries
# dTLB 4M:       4-way, 8 entries
# L1 inst cache: 16k, 4-way, 32b lines
# L1 data cache: 16k, 2-way, 32b lines
# L2 cache:      512k, 4-way, 32b lines
cpuid.0x00000002=eax=0x03020101,ebx=0,ecx=0,edx=0x0c040843
