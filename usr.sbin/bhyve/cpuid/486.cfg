#
# Intel 486DX4 / SL-Enhanced
# AMD Enhanced Am486 / 5x86
#
# Not the first, but the lowest x86 CPU family with CPUID
#
# Features:
# FPU, VME
#
include clear_cpuid.cfg

cpuid.level=0x00000001
cpuid.xlevel=0

cpuid.family=4
cpuid.model=8
cpuid.stepping=3

cpuid.features+=fpu,vme
