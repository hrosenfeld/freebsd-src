#
# x86-64 architecture level v1
#
# Corresponds roughly to the Intel Prescott / AMD K8
#
# Enable the following instruction set extensions:
# CMOV, CX8, FPU, FXSR, MMX, SSE, SSE2
#
# In addition to those, enable these common x86 features:
# APIC, CLFSH, DE, LM, MCA, MCE, MTRR, NX, MSR, PAE, PAT, PGE, PSE, PSE36, SEP,
# SS, SYSCALL, TSC, VME
#
include clear_cpuid.cfg

cpuid.level=7
cpuid.xlevel=0x80000008

cpuid.features+=apic,clfsh,de,lm,mca,mce,mtrr,nx,msr,pae,pat,pge,pse,pse36,sep
cpuid.features+=ss,syscall,tsc,vme

cpuid.features+=cmov,cx8,fpu,fxsr,mmx,sse,sse2

cpuid.physical=40
cpuid.linear=48

cpuid.brand=bhyve x86-64 Architecture Level v1

# Intel Cache / TLB
#
# 05: dTLB1 4M:      4-way, 32 entries
# b0: iTLB 4k:       4-way, 128 entries
# b1: iTLB 2M/4M:    4-way, 8 entries / 4-way, 4 entries
# 01: Cache / TLB info valid
# 57: dTLB0 4k:      4-way, 16 entries
# 56: dTLB0 4M:      4-way, 16 entries
# f0: Prefetching:   64b
# b4: dTLB1 4k:      4-way, 256 entries
# 30: L1 inst cache: 32k, 8-way, 64b lines
# 2c: L1 data cache: 32k, 8-way, 64b lines
# 7d: L2 cache:      2M, 8-way, 64b lines
cpuid.0x00000002=eax=0x05b0b101,ebx=0x005657f0,ecx=0,edx=0x2cb4307d

# Intel Deterministic Cache Parameters
#
# L1 data cache, self-initializing
# L1d: WBINVD/INVD, 8-way, 1 partition, 64b lines, 64 sets (32k)
cpuid.0x00000004,0x00+=eax|=0x00000121,ebx=0x01c0003f,ecx=0x0000003f,edx=0x00000001
#
# L1 inst cache, self-initializing
# L1i: WBINVD/INVD, 8-way, 1 partition, 64b lines, 64 sets (32k)
cpuid.0x00000004,0x01+=eax|=0x00000122,ebx=0x01c0003f,ecx=0x0000003f,edx=0x00000001
#
# L2 unified cache, self-initializing
# L2: WBINVD/INVD, 8-way, 1 partition, 64b lines, 4096 sets (2M)
cpuid.0x00000004,0x02+=eax|=0x00000143,ebx=0x01c0003f,ecx=0x00000fff,edx=0x00000001


# L1 Cache / TLB
#
# EAX: L1 TLB 2M/4M:  0xff08ff08 (dTLB: full, 8 entries, iTLB: full, 8 entries)
# EBX: L1 TLB 4k:     0xff20ff20 (dTLB: full, 32 entries, iTLB: full, 32 entries)
# ECX: L1 data cache: 0x40020140 (64k, 2-way, 1 line/tag, 64b lines)
# EDX: L1 inst cache: 0x40020140 (64k, 2-way, 1 line/tag, 64b lines)
cpuid.0x80000005=eax=0xff08ff08,ebx=0xff20ff20,ecx=0x40020140,edx=0x40020140

# L2/L3 Cache / TLB
#
# EAX: L2 TLB 2M/4M:  0x00000000 (unsupported)
# EBX: L2 TLB 4k:     0x42004200 (dTLB: 4-way, 512 entries, iTLB: 4-way, 512 entries)
# ECX: L2 cache:      0x04008140 (1024k, 16-way, 1 line/tag, 64b lines)
# EDX: L3 cache:      0x00000000 (unsupported)
cpuid.0x80000006=eax=0,ebx=0x42004200,ecx=0x04008140,edx=0
