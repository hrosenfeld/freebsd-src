#
# AMD K5 (5k86)
#
# All of the 486 features, plus:
# CX8, DE, MCE, MSR, PGE, PSE, TSC
#
# According to AMD publication 20734, the first model K5 used the APIC
# bit to indicate PGE. This was corrected in the 2nd model.
# 
include 486.cfg

cpuid.vendor=AuthenticAMD
cpuid.xlevel=0x80000005

cpuid.family=5
cpuid.model=3
cpuid.stepping=4

cpuid.features+=cx8,de,mce,msr,pge,pse,tsc

cpuid.brand=AMD-K5(tm) Processor

# L1 Cache / TLB:
#
# L1 TLB 2M/4M:  0x00000000 (unsupported)
# L1 TLB 4k:     0x04800000 (dTLB: 4-way, 0x80 Entries, iTLB: not present)
# L1 data cache: 0x08040120 (8kb, 4-way, 1 line/tag, 32b lines)
# L1 inst cache: 0x10040120 (16kb, 4-way, 1 line/tag, 32b lines)
cpuid.0x80000005=eax=0,ebx=0x04800000,ecx=0x08040120,edx=0x10040120
