#
# Intel Westmere
#
# All of the Nehalem features, plus:
# AESNI, PCLMULQDQ
#

include nehalem.cfg

cpuid.model=44
cpuid.stepping=1

cpuid.features+=aesni,pclmulqdq

cpuid.brand=Intel(R) Xeon(R) CPU           X5667  @ 3.07GHz

# Cache / TLB
#
# 55: iTLB 2M/4M:  full, 7 entries
# 03: dTLB 4k:     4-way, 64 entries
# 5a: dTLB0 2M/4M: 4-way, 32 entries
# 01: Cache / TLB info valid
# f0: Prefetching: 64b
# b2: iTLB 4k:     4-way, 64 entries
# ff: use 0x00000004 for cache information
# ca: L2 TLB 4k:   4-way, 512 entries
cpuid.0x00000002=eax=0x55035a01,ebx=0x00f0b2ff,ecx=0,edx=0x00ca0000

# Deterministic Cache Parameters
#
# L3: 12288 sets (12M)
cpuid.0x00000004,0x03+=ecx=0x00002fff
