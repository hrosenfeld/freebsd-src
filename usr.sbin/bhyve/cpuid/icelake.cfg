#
# Intel Ice Lake
#
# All of the Cooper Lake features, plus:
# AVX512VBMI, AVX512VBMI2, AVX512VPOPCNTDQ, AVX512BITALG, VAES, VPCLMULQDQ
#
# Masked by vmm: GFNI, LA57, UMIP
#

include cascadelake.cfg

cpuid.level=0x0000001b

cpuid.model=106
cpuid.stepping=6

cpuid.features+=avx512vbmi,avx512vbmi2,avx512vpopcntdq,avx512bitalg
cpuid.features+=vaes,vpclmulqdq

cpuid.linear=57

cpuid.brand=Intel(R) Xeon(R) Gold 6330 CPU @ 2.00GHz

# Cache / TLB
#
# fe: use 0x00000018 for TLB information
# ff: use 0x00000004 for cache information
# 01: Cache / TLB info valid
# f0: Prefetching:        64b
cpuid.0x00000002=eax=0x00feff01,ebx=0x000000f0,ecx=0,edx=0

# Deterministic Cache Parameters
#
# L1d: 12-way, 1 partition, 64b lines, 64 sets (48k)
cpuid.0x00000004,0x00+=ebx=0x02c0003f,ecx=0x0000003f
#
# L1i: 8-way, 1 partition, 64b lines, 64 sets (32k)
cpuid.0x00000004,0x01+=ebx=0x01c0003f,ecx=0x0000003f
#
# L2: 20-way, 1 partition, 64b lines, 512 sets (640k)
cpuid.0x00000004,0x02+=ebx=0x04c0003f,ecx=0x000001ff
#
# L3: 12-way, 1 partition, 64b lines, 57344 sets (42M)
cpuid.0x00000004,0x03+=ebx=0x02c0003f
#
# TLB: 7 indices supported
cpuid.0x00000018,0x00+=eax=0x00000007

# Deterministic Address Translation Parameters
#
# L1 dTLB, fully associative, shared by 1, 1 set, 8-way, 4k/2M/4M
cpuid.0x00000018,0x01+=ebx=0x00080007,ecx=0x00000001,edx=0x00004122
#
# L1 store-only TLB, fully associative, shared by 1, 1 set, 16-way, 4k/2M/4M/1G
cpuid.0x00000018,0x02+=ebx=0x0010000F,ecx=0x00000001,edx=0x00004125
#
# L1 load-only TLB, shared by 1, 10 sets, 4-way, 4k
cpuid.0x00000018,0x03+=ebx=0x00040001,ecx=0x00000010,edx=0x00004024
#
# L1 load-only TLB, 8 sets, 4-way, 2M/4M
cpuid.0x00000018,0x04+=ebx=0x00040006,ecx=0x00000008,edx=0x00004024
#
# L1 load-only TLB, 1 set, 8-way, 1G
cpuid.0x00000018,0x05+=ebx=0x00080008,ecx=0x00000001,edx=0x00004124
#
# L1 unified TLB, 128 sets, 8-way, 4k/2M/4M
cpuid.0x00000018,0x06+=ebx=0x00080007,ecx=0x00000080,edx=0x00004043
#
# L1 unified TLB, 128 sets, 8-way, 4k/1G
cpuid.0x00000018,0x07+=ebx=0x00080009,ecx=0x00000080,edx=0x00004043
