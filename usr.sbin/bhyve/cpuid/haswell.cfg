#
# Intel Haswell
#
# All of the Ivy Bridge features, plus:
# ABM, AVX2, BMI1, BMI2, FMA, HLE, INVPCID, MOVBE, PCID, RTM
#

include ivybridge.cfg

cpuid.model=60
cpuid.stepping=3

cpuid.features+=abm,avx2,bmi1,bmi2,fma,hle,invpcid,movbe,pcid,rtm

cpuid.physical=39

cpuid.brand=Intel(R) Xeon(R) CPU E3-1245 v3 @ 3.40GHz

# Cache / TLB
#
# 76: iTLB 2M/4M:       full, 8 entries
# 03: dTLB 4k:          4-way, 64 entries
# 63: dTLB 2M/4M + 1GB: 4-way, 32 entries + 4-way, 4 entries
# 01: Cache / TLB info valid
# f0: Prefetching:      64b
# b5: iTLB 4k:          8-way, 64 entries
# ff: use 0x00000004 for cache information
# c1: L2 TLB 4k/2M:     8-way, 1024 entries
cpuid.0x00000002=eax=0x76036301,ebx=0x00f0b5ff,ecx=0,edx=0x00c10000
