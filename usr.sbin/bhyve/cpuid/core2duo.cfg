#
# Intel Core 2 Duo
#
# All of the Core Duo features, plus:
# CX16, DTES64, LAHF, LM, SYSCALL, SSSE3, TSC_INVARIANT
# Masked by vmm: DS_CPL
#

include coreduo.cfg

cpuid.model=15
cpuid.stepping=7

cpuid.features+=cx16,dtes64,lahf,lm,syscall,ssse3,tsc_invariant

cpuid.physical=36
cpuid.linear=48

cpuid.brand=Intel(R) Xeon(R) CPU            X3210  @ 2.13GHz

# Cache / TLB
#
# 05: dTLB1 4M:      4-way, 32 entries
# b0: iTLB 4k:       4-way, 128 entries
# b1: iTLB 2M/4M:    4-way, 8 entries / 4-way, 4 entries
# 01: Cache / TLB info valid
# 57: dTLB0 4k:      4-way, 16 entries
# 56: dTLB0 4M:      4-way, 16 entries
# f0: Prefetching:   64b
# b4: dTLB1 4k:      4-way, 256 entries
# 30: L1 inst cache: 32k, 8-way, 64b lines
# 2c: L1 data cache: 32k, 8-way, 64b lines
# 49: L2 cache:      4M, 16-way, 64b lines
cpuid.0x00000002=eax=0x05b0b101,ebx=0x005657f0,ecx=0,edx=0x2cb43049

# Deterministic Cache Parameters
#
# L2: 16-way, 1 partition, 64b lines (4M)
cpuid.0x00000004,0x02+=ebx=0x03c0003f
