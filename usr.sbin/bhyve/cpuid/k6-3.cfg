#
# AMD K6-III
#
# All of the K6-2 features
#
include k6-2.cfg

cpuid.xlevel=0x80000006

cpuid.model=9
cpuid.stepping=1

cpuid.brand=AMD-K6(tm) 3D+ Processor

# L2 Cache / TLB
#
# L2 TLB 2M/4M:  0x00000000 (unsupported)
# L2 TLB 4k:     0x00000000 (unsupported)
# L2 cache:      0x01004220 (256k, 4-way, 2 lines/tag, 32b lines)
# L3 cache:      0x00000000 (unsupported)
cpuid.0x80000006=eax=0,ebx=0,ecx=0x01004220,edx=0
