#
# AMD Opteron (Gen 5)
#
# All of the Opteron (Gen 4) features, plus:
# BMI1, F16C, FMA, TBM
#
include opteron-g4.cfg

cpuid.model=2
cpuid.stepping=0

cpuid.features+=bmi1,f16c,fma,tbm

cpuid.brand=AMD Opteron(tm) Processor 6380                 

# L1 Cache / TLB
#
# L1 TLB 2M/4M:  0xff40ff18 (dTLB: full, 64 entries, iTLB: full, 24 entries)
# L1 TLB 4k:     0xff20ff30 (dTLB: full, 32 entries, iTLB: full, 48 entries)
# L1 data cache: 0x10040140 (16k, 4-way, 1 line/tag, 64b lines)
# L1 inst cache: 0x40020140 (64k, 2-way, 1 line/tag, 64b lines)
cpuid.0x80000005=eax=0xff20ff18,ebx=0xff20ff30,ecx=0x10040140,edx=0x40020140

# L2/L3 Cache / TLB
#
# L2 TLB 2M/4M:  0x64000000 (dTLB: 8-way, 512 entries, iTLB: unsupported)
# L2 TLB 4k:     0x64004200 (dTLB: 8-way, 512 entries, iTLB: 4-way, 512 entries)
# L2 cache:      0x08008140 (512k, 16-way, 1 line/tag, 64b lines)
# L3 cache:      0x0060e140 (12MB-12.5MB, 128-way, 1 line/tag, 64b lines)
cpuid.0x80000006=eax=0x64006400,ebx=0x64004200,ecx=0x08008140,edx=0x0060e140

# L1/L2 TLB 1G
#
# L1 TLB 1G:     0xf040f018 (dTLB: full, 64 entries, iTLB: full, 24)
# L2 TLB 1G:     0x64006400 (dTLB: 8-way, 1k entries, iTLB: 8-way, 1k entries)
cpuid.0x80000019=eax=0xf040f018,ebx=0x64006400,ecx=0,edx=0

# Cache Properties
#
# x0 (DC), EAX: 0x00000121 (self-init, level 1, data)
#          EBX: 0x00c0003f (4-way, 1 partition, 64b lines)
#          ECX: 0x0000003f (64 sets)
#          EDX: 0x00000000
cpuid.0x8000001d,0x00=eax=0x00000121,ebx=0x00c0003f,ecx=0x0000003f,edx=0

# x1 (IC), EAX: 0x00004122 (shared by 2 cores, self-init, level 1, inst)
#          EBX: 0x0040003f (2-way, 1 partition, 64b lines)
#          ECX: 0x000001ff (512 sets)
#          EDX: 0x00000000
cpuid.0x8000001d,0x01=eax=0x00004122,ebx=0x0040003f,ecx=0x000001ff,edx=0

# x2 (L2), EAX: 0x00004143 (shared by 2 cores, self-init, level 2, unified)
#          EBX: 0x03c0003f (16-way, 1 partition, 64b lines)
#          ECX: 0x000007ff (2048 sets)
#          EDX: 0x00000001 (WBINVD/INVD)
cpuid.0x8000001d,0x02=eax=0x00004143,ebx=0x03c0003f,ecx=0x000007ff,edx=0x00000001

# x3 (L3), EAX: 0x0001c163 (shared by 8 cores, self-init, level 3, unified)
#          EBX: 0x0bc0003f (48-way, 1 partition, 64b lines)
#          ECX: 0x000007ff (2048 sets)
#          EDX: 0x00000001 (WBINVD/INVD)
cpuid.0x8000001d,0x03=eax=0x0001c163,ebx=0x0bc0003f,ecx=0x000007ff,edx=0x00000001
