#
# Intel Sandy Bridge
#
# All of the Westmere features, plus:
# ARAT, AVX, XSAVE, XSAVEOPT
#
# Masked by vmm: TSCDLT, X2APIC
#

include westmere.cfg

cpuid.level=0x0000000d

cpuid.model=42
cpuid.stepping=7

cpuid.features+=x87,xmm,ymm_hi128
cpuid.features+=arat,avx,xsave,xsaveopt

cpuid.physical=36

cpuid.brand=          Intel(R) Xeon(R) CPU E31275 @ 3.40GHz

# Cache / TLB
#
# 76: iTLB 2M/4M:  full, 8 entries
# 03: dTLB 4k:     4-way, 64 entries
# 5a: dTLB0 2M/4M: 4-way, 32 entries
# 01: Cache / TLB info valid
# f0: Prefetching: 64b
# b2: iTLB 4k:     4-way, 64 entries
# ff: use 0x00000004 for cache information
# ca: L2 TLB 4k:   4-way, 512 entries
cpuid.0x00000002=eax=0x76035a01,ebx=0x00f0b2ff,ecx=0,edx=0x00ca0000

# Deterministic Cache Parameters
#
# L1i: 8-way, 1 partition, 64b lines, 64 sets (32k)
cpuid.0x00000004,0x01+=ebx=0x01c0003f,ecx=0x0000003f
#
# L3: 8192 sets (8M), complex index
cpuid.0x00000004,0x03+=ecx=0x00001fff,edx=0x00000006
