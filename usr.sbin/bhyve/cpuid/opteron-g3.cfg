#
# AMD Opteron (Gen 3)
#
# All of the Opteron (Gen 2) features except HTT, plus:
# PREFETCH, ABM, POPCNT, MAS, SSE4A, TSC_INVARIANT
#
# masked by vmm: 100MHZ_STEPS, HW_PSTATE, IBS, MONITOR, OSVW
#
include opteron-g2.cfg

cpuid.level=0x000000005

cpuid.family=16
cpuid.model=2
cpuid.stepping=10

cpuid.features+=-htt
cpuid.features+=prefetch,abm,popcnt,mas,sse4a,tsc_invariant

cpuid.pkgtype=am3

cpuid.physical=48

cpuid.brand=Quad-Core AMD Opteron(tm) Processor 2344 HE

# L1 Cache / TLB
#
# L1 TLB 2M/4M:  0xff30ff30 (dTLB: full, 48 entries, iTLB: full, 48 entries)
# L1 TLB 4k:     0xff30ff20 (dTLB: full, 48 entries, iTLB: full, 32 entries)
# L1 data cache: 0x40020140 (64k, 2-way, 1 line/tag, 64b lines)
# L1 inst cache: 0x40020140 (64k, 2-way, 1 line/tag, 64b lines)
cpuid.0x80000005=eax=0xff30ff10,ebx=0xff30ff20,ecx=0x40020140,edx=0x40020140

# L2/L3 Cache / TLB
#
# L2 TLB 2M/4M:  0x20800000 (dTLB: 2-way, 128 entries, iTLB: unsupported)
# L2 TLB 4k:     0x42004200 (dTLB: 4-way, 512 entries, iTLB: 4-way, 512 entries)
# L2 cache:      0x02008140 (512k, 16-way, 1 line/tag, 64b lines)
# L3 cache:      0x0010a140 (2MB-2.5MB, 16-way, 1 line/tag, 64b lines)
cpuid.0x80000006=eax=0x20800000,ebx=0x42004200,ecx=0x02008140,edx=0x0010a140

# L1/L2 TLB 1G
#
# L1 TLB 1G:     0xf0300000 (dTLB: full, 48 entries, iTLB: unsupported)
# L2 TLB 1G:     0x00000000 (unsupported)
cpuid.0x80000019=eax=0xf030000,ebx=0,ecx=0,edx=0
