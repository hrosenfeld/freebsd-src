#
# AMD K6
#
# All of the 486 features except, plus:
# CX8, DE, MCE, MMX, MSR, PSE, TSC
# 
include 486.cfg

cpuid.xlevel=0x80000005

cpuid.model=6
cpuid.stepping=2

cpuid.features+=cx8,de,mce,mmx,msr,pse,tsc

cpuid.brand=AMD-K6tm w/ multimedia extensions

# L1 Cache / TLB
#
# L1 TLB 2M/4M:  0x00000000 (unsupported)
# L1 TLB 4k:     0x02800140 (dTLB: 2-way, 0x80 Entries, iTLB: 1-way, 0x40 Entries)
# L1 data cache: 0x20020220 (32k, 2-way, 2 lines/tag, 32b lines)
# L1 inst cache: 0x20020220 (32k, 2-way, 2 lines/tag, 32b lines)
cpuid.0x80000005=eax=0,ebx=0x02800140,ecx=0x20020220,edx=0x20020220
