#
# AMD Opteron (Gen 2)
#
# All of the Opteron (Gen 1) features, plus:
# AMD_APIC, CMP, CR8, CX16, FFXSR, HTT, LAHF, RDTSCP, SSE3
#
# masked by vmm: STC
#
include opteron-g1.cfg

cpuid.model=65
cpuid.stepping=2

cpuid.features+=amd_apic,cmp,cr8,cx16,ffxsr,htt,lahf,rdtscp,sse3

cpuid.brand=Dual-Core AMD Opteron(tm) Processor 2210 HE
