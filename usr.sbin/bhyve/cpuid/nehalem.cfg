#
# Intel Nehalem
#
# All of the Core 2 Duo features, plus:
# POPCNT, RDTSCP, SSE42, SSE41
#

include core2duo.cfg

cpuid.level=0x0000000b

cpuid.model=26
cpuid.stepping=5

cpuid.features+=popcnt,rdtscp,sse4.2,sse4.1

cpuid.physical=40

cpuid.brand=Intel(R) Xeon(R) CPU            E5520  @ 2.27GHz

# Cache / TLB
#
# 55: iTLB 2M/4M:    full, 7 entries
# 03: dTLB 4k:       4-way, 64 entries
# 5a: dTLB0 2M/4M:   4-way, 32 entries
# 01: Cache / TLB info valid
# f0: Prefetching:   64b
# 0b: iTLB 4k:       4-way, 64 entries
# e4: L3 cache:      8M, 16-way, 64b lines
# 09: L1 inst cache: 32k, 4-way, 64b lines
# ca: L2 TLB 4k:     4-way, 512 entries
# 21: L2 cache:      256k, 8-way, 64b lines
# 2c: L1 data cache: 32k, 8-way, 64b lines
cpuid.0x00000002=eax=0x55035a01,ebx=0x00f0b2e4,ecx=0,edx=0x09ca212c

# Deterministic Cache Parameters
#
# L1d: no WBINVD/INVD
cpuid.0x00000004,0x00+=edx=0x00000000
#
# L1i: no WBINVD/INVD, 4-way, 1 partition, 64b lines, 128 sets (32k)
cpuid.0x00000004,0x01+=ebx=0x00c0003f,ecx=0x0000007f,edx=0x00000000
#
# L2: no WBINVD/INVD, 8-way, 1 partition, 64b lines, 512 sets (256k)
cpuid.0x00000004,0x02+=ebx=0x01c0003f,ecx=0x000001ff,edx=0x00000000
#
# L3 unified cache, self-initializing, inclusive
# L3: 16-way, 1 partition, 64b lines, 8192 sets (8M)
cpuid.0x00000004,0x03+=eax|=0x00000163,ebx=0x03c0003f,ecx=0x00001fff,edx=0x00000002
