#
# Intel Pentium 4
#
# All of the Pentium III features, plus:
# CLFSH, CX16, DTES64, HTT, LAHF, LM, NX, PBE, SS, SSE2, SSE3, SYSCALL,
# xTPR
# Masked by VMM: ACPI, DS_CPL, EST, MON, TM
#
include pentium3.cfg

cpuid.level=0x00000005
cpuid.xlevel=0x80000008

cpuid.family=15
cpuid.model=4
cpuid.stepping=10

cpuid.features+=clfsh,cx16,dtes64,htt,lahf,lm,nx,pbe,ss,sse2,sse3,syscall,xtpr

cpuid.brand=              Intel(R) Xeon(TM) CPU 3.40GHz

# Cache / TLB
# 60: L1 data cache:  16k, 8-way, 64b lines
# 5b: dTLB 4k/4M:     64 entries
# 50: iTLB 4k/2M/4M:  64 entries
# 01: Cache / TLB info valid
# 7d: L2 cache:       2M, 8-way, 64b lines
# 70: Trace cache:    12 K-uop, 8-way
# 40: L3 cache:       not present
cpuid.0x00000002=eax=0x605b5001,ebx=0,ecx=0,edx=0x007d7040

# Deterministic Cache Parameters
#
# L1 data cache, self-initializing
# L1d: 8-way, 1 partition, 64b lines, 32 sets (16k)
cpuid.0x00000004,0x00+=eax|=0x00000121,ebx=0x01c0003f,ecx=0x0000001f,edx=0
#
# L2 cache, self-initializing
# L2: 8-way, 2 partitions, 64b lines, 2048 sets (2M)
cpuid.0x00000004,0x01+=eax|=0x00000143,ebx=0x01c0103f,ecx=0x000007ff,edx=0
